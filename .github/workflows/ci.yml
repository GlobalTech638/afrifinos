name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afrifinos
          POSTGRES_PASSWORD: afrifinos_ci
          POSTGRES_DB: afrifinos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afrifinos -d afrifinos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Build-time placeholders only; CI never authenticates against this project.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      DATABASE_URL: postgresql://afrifinos:afrifinos_ci@localhost:5432/afrifinos_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
